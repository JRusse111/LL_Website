<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts: Montserrat (Body) & Orbitron (Headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/global.css">
</head>
<body>

    <!-- SECTION A: GLOBAL NAVIGATION BAR -->
    <header id="site-header">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <img src="../Images/logo_transparent.png" alt="Logic Legends Logo">
                LOGIC LEGENDS
            </a>

            <nav>
                <ul class="nav-links">
                    <li><a href="../index.html#about">About</a></li>
                    <li><a href="../index.html#features">Features</a></li>
                    <li><a href="../index.html#gallery">Gallery</a></li>
                    <li><a href="../index.html#download">Download</a></li>
                    <li><a href="../InstructorDashboard/i_dashboard.html">Dashboard</a></li>
                    <li><a href="login_page.html" class="login-btn">LOGIN</a></li>
                </ul>
            </nav>

            <button class="hamburger" id="hamburger-btn" aria-label="Toggle Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>
    <!-- Mobile Navigation Overlay -->
    <div class="mobile-menu" id="mobile-menu">
        <ul>
            <li><a href="../index.html#about" class="mobile-link">About</a></li>
            <li><a href="../index.html#features" class="mobile-link">Features</a></li>
            <li><a href="../index.html#gallery" class="mobile-link">Gallery</a></li>
            <li><a href="../index.html#download" class="mobile-link">Download</a></li>
            <li><a href="../InstructorDashboard/i_dashboard.html" class="mobile-link">Dashboard</a></li>
            <li style="margin-top: 2rem;"><a href="login_page.html" class="btn btn-primary mobile-link login-btn">LOGIN</a></li>
        </ul>
    </div>

    <!-- SECTION B: CENTERED LAYOUT CONTAINER -->
    <main class="signup-main">
        
        <!-- SECTION C: THE FORM CARD -->
        <div class="signup-card">
            
            <div class="card-header">
                <img src="../Images/logo_transparent.png" alt="Logic Legends Logo" class="card-logo">
                <h1>Create Account</h1>
            </div>

            <!-- Google Sign Up Button -->
            <button type="button" id="googleSignupBtn" class="btn-google">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Sign up with Google
            </button>

            <!-- Divider -->
            <div class="divider">OR</div>

            <!-- Registration Form -->
            <form action="#" method="POST" class="signup-form" id="signupForm">
                
                <!-- Email Input -->
                <div class="input-group">
                    <svg class="input-icon-left" viewBox="0 0 24 24">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input type="email" id="signupEmailInput" class="form-input" placeholder="Email Address" required>
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <svg class="input-icon-left" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" class="form-input" id="signupPasswordInput" placeholder="Password" required>
                    <!-- Eye Icon for Visibility Toggle -->
                    <svg class="input-icon-right" id="togglePassword" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">Sign Up</button>
            </form>

            <!-- Card Footer / Login Link -->
            <div class="card-footer">
                <p>Already have an account?</p>
                <a href="login_page.html" class="btn-outline">Log In</a>
            </div>

        </div>
    </main>

    <!-- ==========================================================================
         JAVASCRIPT INTERACTIVITY
         ========================================================================== -->
    <script src="../JS/nav.js"></script>
    <script type="module" src="../JS/navbar_auth.js"></script>
    <script type="module" src="../JS/auth.js"></script>
</body>
</html>

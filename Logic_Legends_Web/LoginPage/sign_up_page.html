<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Legends | Sign Up</title>
    
    <!-- Google Fonts: Montserrat (Body) & Orbitron (Headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="../CSS/global.css">
</head>
<body>

    <!-- SECTION A: GLOBAL NAVIGATION BAR -->
    <header id="site-header">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <img src="../Images/logo_transparent.png" alt="Logic Legends Logo">
                LOGIC LEGENDS
            </a>

            <nav>
                <ul class="nav-links">
                    <li><a href="../index.html#about">About</a></li>
                    <li><a href="../index.html#features">Features</a></li>
                    <li><a href="../index.html#gallery">Gallery</a></li>
                    <li><a href="../index.html#download">Download</a></li>
                    <li data-admin-nav hidden><a href="../InstructorDashboard/i_dashboard.html">Dashboard</a></li>
                    <li><a href="login_page.html" class="login-btn">LOGIN</a></li>
                </ul>
            </nav>

            <button class="hamburger" id="hamburger-btn" aria-label="Toggle Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>
    <!-- Mobile Navigation Overlay -->
    <div class="mobile-menu" id="mobile-menu">
        <ul>
            <li><a href="../index.html#about" class="mobile-link">About</a></li>
            <li><a href="../index.html#features" class="mobile-link">Features</a></li>
            <li><a href="../index.html#gallery" class="mobile-link">Gallery</a></li>
            <li><a href="../index.html#download" class="mobile-link">Download</a></li>
            <li data-admin-nav hidden><a href="../InstructorDashboard/i_dashboard.html" class="mobile-link">Dashboard</a></li>
            <li style="margin-top: 2rem;"><a href="login_page.html" class="btn btn-primary mobile-link login-btn">LOGIN</a></li>
        </ul>
    </div>

    <!-- SECTION B: CENTERED LAYOUT CONTAINER -->
    <main class="signup-main">
        
        <!-- SECTION C: THE FORM CARD -->
        <div class="signup-card">
            
            <div class="card-header">
                <img src="../Images/logo_transparent.png" alt="Logic Legends Logo" class="card-logo">
                <h1>Create Account</h1>
            </div>

            <!-- Google Sign Up Button -->
            <button type="button" id="googleSignupBtn" class="btn-google">
                <img src="../Images/google-icon.png" class="google-icon" width="22" height="22" style="width:22px;height:22px;max-width:22px;object-fit:cover;flex:0 0 22px;" alt="" aria-hidden="true">
                Sign up with Google
            </button>

            <!-- Divider -->
            <div class="divider">OR</div>

            <!-- Registration Form -->
            <form action="#" method="POST" class="signup-form" id="signupForm">
                
                <!-- Email Input -->
                <div class="input-group">
                    <i class="bx bx-envelope input-icon-left" aria-hidden="true"></i>
                    <input type="email" id="signupEmailInput" class="form-input" placeholder="Email Address" aria-label="Email address" autocomplete="email" required>
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <i class="bx bx-lock-alt input-icon-left" aria-hidden="true"></i>
                    <input type="password" class="form-input" id="signupPasswordInput" placeholder="Password" aria-label="Password" autocomplete="new-password" required>
                    <!-- Eye Icon for Visibility Toggle -->
                    <button type="button" class="input-icon-right" id="togglePassword" aria-label="Show password" aria-pressed="false"><i class="bx bx-show" aria-hidden="true"></i></button>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">Sign Up</button>
            </form>

            <!-- Card Footer / Login Link -->
            <div class="card-footer">
                <p>Already have an account?</p>
                <a href="login_page.html" class="btn-outline">Log In</a>
            </div>

        </div>
    </main>

    <!-- ==========================================================================
         JAVASCRIPT INTERACTIVITY
         ========================================================================== -->
    <script src="../JS/nav.js"></script>
    <script type="module" src="../JS/navbar_auth.js"></script>
    <script type="module" src="../JS/auth.js"></script>
</body>
</html>

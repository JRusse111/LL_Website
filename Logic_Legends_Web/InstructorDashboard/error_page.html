<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Legends | Access Denied</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
    
    <link rel="stylesheet" href="../CSS/global.css">

    <style>
        .error-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--color-black);
            text-align: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* Subtle background glow */
        .error-layout::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(252, 163, 17, 0.1) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .error-content {
            position: relative;
            z-index: 1;
            background-color: var(--color-navy);
            padding: 4rem;
            border-radius: 12px;
            border: 1px solid rgba(252, 163, 17, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
        }

        .error-icon {
            display: inline-block;
            font-size: 80px;
            line-height: 1;
            color: #ff4d4d;
            margin-bottom: 1rem;
        }

        .error-code {
            font-family: var(--font-heading);
            font-size: 5rem;
            color: var(--color-gold);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .error-title {
            font-size: 1.5rem;
            color: var(--color-white);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .error-message {
            color: var(--color-light);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="error-layout">
        <div class="error-content">
            <i class="bx bx-shield-x error-icon" aria-hidden="true"></i>
            
            <h1 class="error-code">403</h1>
            <h2 class="error-title">Access Denied</h2>
            <p class="error-message" id="dynamic-error-msg">You do not have permission to view this page.</p>
            
            <a href="../index.html" class="btn btn-primary" style="width: 100%;">Return to Home</a>
        </div>
    </div>

</body>
</html>
